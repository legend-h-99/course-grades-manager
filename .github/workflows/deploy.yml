name: Build & Verify Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build and check API security
        run: npm run test:security

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production
          path: dist
          retention-days: 7

  verify-production:
    # Cloudflare's existing Git integration deploys main with its configured bindings.
    # Verify the served release instead of attempting a second deployment without credentials.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-production
          path: dist
      - name: Verify live frontend and private API after Cloudflare deployment
        run: node scripts/verify-production-deployment.mjs
